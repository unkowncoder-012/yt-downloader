<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 480px; }
        .card { background: #1f1f1f; padding: 20px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #333; }
        h1, h2 { margin: 0 0 12px 0; font-size: 18px; color: #ff3333; }
        label { display: block; font-size: 12px; font-weight: 600; color: #aaa; margin-top: 10px; }
        input[type="text"], select { width: 100%; padding: 10px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-box input { margin-top: 0; }
        button { background: #cc0000; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 12px; }
        button:disabled { background: #555; }
        .btn-inline { width: auto; margin-top: 0; padding: 10px 14px; white-space: nowrap; }
        
        /* Video Results & Embed */
        #results-container { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .result-item { display: flex; gap: 10px; background: #2a2a2a; padding: 8px; border-radius: 6px; cursor: pointer; align-items: center; }
        .result-item img { width: 70px; height: 45px; object-fit: cover; border-radius: 4px; }
        .result-info { flex: 1; min-width: 0; font-size: 12px; }
        .result-title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eee; }
        .result-sub { color: #888; font-size: 11px; }
        #player-container { display: none; margin-top: 10px; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; }
        #player-container iframe { width: 100%; height: 100%; border: none; }

        /* Progress Bar */
        #progress-box { display: none; margin-top: 15px; background: #2a2a2a; padding: 12px; border-radius: 8px; }
        .bar-bg { width: 100%; height: 10px; background: #444; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .bar-fill { height: 100%; width: 0%; background: #00e676; transition: width 0.2s; }
        .stats { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-top: 6px; }
        #status-msg { font-size: 12px; text-align: center; margin-top: 8px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Search Section -->
        <div class="card">
            <h2>Search YouTube</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search keywords...">
                <button class="btn-inline" onclick="performSearch()">Search</button>
            </div>
            <div id="results-container"></div>
            <div id="player-container">
                <iframe id="preview-frame" src="" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Download Section -->
        <div class="card">
            <h2>Download Config</h2>
            <label for="url">Target URL</label>
            <input type="text" id="url" placeholder="Paste link or pick from above" oninput="handleUrlAutoDetect()">

            <label for="type">Download Mode</label>
            <select id="type" onchange="toggleResolution()">
                <option value="single">Single Video</option>
                <option value="playlist">Full Playlist</option>
                <option value="audio">Audio Only (MP3)</option>
            </select>

            <div id="res-box">
                <label for="resolution">Video Quality</label>
                <select id="resolution">
                    <option value="best">Best Available</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                    <option value="360">360p</option>
                </select>
            </div>

            <button id="dl-btn" onclick="startStreamingDownload()">Download</button>

            <!-- Live Progress Bar -->
            <div id="progress-box">
                <div id="status-msg">Initializing...</div>
                <div class="bar-bg">
                    <div class="bar-fill" id="bar-fill"></div>
                </div>
                <div class="stats">
                    <span id="speed-stat">0 KiB/s</span>
                    <span id="percent-stat">0%</span>
                    <span id="eta-stat">ETA: --:--</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-detect playlist links when pasted
        function handleUrlAutoDetect() {
            const val = document.getElementById('url').value;
            const typeSelect = document.getElementById('type');
            if (val.includes('list=') && !val.includes('v=')) {
                typeSelect.value = 'playlist';
            } else if (!val.includes('list=')) {
                if (typeSelect.value === 'playlist') typeSelect.value = 'single';
            }
            toggleResolution();
        }

        function toggleResolution() {
            const type = document.getElementById('type').value;
            document.getElementById('res-box').style.display = (type === 'single') ? 'block' : 'none';
        }

        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            const container = document.getElementById('results-container');
            container.innerHTML = '<div style="font-size:12px;color:#888;">Searching...</div>';

            try {
                const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                container.innerHTML = '';

                (data.results || []).forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'result-item';
                    el.innerHTML = `
                        <img src="${item.thumbnail}">
                        <div class="result-info">
                            <div class="result-title">${item.title}</div>
                            <div class="result-sub">${item.uploader} &bull; ${item.duration}</div>
                        </div>
                    `;
                    el.onclick = () => selectVideo(item.url, item.id);
                    container.appendChild(el);
                });
            } catch (e) {
                container.innerHTML = '<div style="font-size:12px;color:#f44336;">Search failed.</div>';
            }
        }

        function selectVideo(url, id) {
            document.getElementById('url').value = url;
            handleUrlAutoDetect();

            if (id) {
                const player = document.getElementById('player-container');
                document.getElementById('preview-frame').src = `https://www.youtube.com/embed/${id}?autoplay=0`;
                player.style.display = 'block';
            }
        }

        async function startStreamingDownload() {
            const url = document.getElementById('url').value.trim();
            const type = document.getElementById('type').value;
            const resolution = document.getElementById('resolution').value;

            if (!url) return;

            const btn = document.getElementById('dl-btn');
            const progressBox = document.getElementById('progress-box');
            const fill = document.getElementById('bar-fill');
            const statusMsg = document.getElementById('status-msg');
            const speed = document.getElementById('speed-stat');
            const pct = document.getElementById('percent-stat');
            const eta = document.getElementById('eta-stat');

            btn.disabled = true;
            progressBox.style.display = 'block';
            fill.style.width = '0%';
            statusMsg.textContent = 'Connecting...';

            try {
                const response = await fetch('/download-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, type, resolution })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.replace('data: ', ''));

                            if (data.status === 'downloading') {
                                fill.style.width = `${data.percent}%`;
                                pct.textContent = `${data.percent}%`;
                                speed.textContent = data.speed;
                                eta.textContent = `ETA: ${data.eta}`;
                                statusMsg.textContent = data.filename || 'Downloading...';
                            } else if (data.status === 'merging') {
                                fill.style.width = '100%';
                                statusMsg.textContent = data.message;
                            } else if (data.status === 'finished') {
                                fill.style.width = '100%';
                                statusMsg.textContent = data.message;
                                btn.disabled = false;
                            } else if (data.status === 'error') {
                                statusMsg.textContent = `Error: ${data.message}`;
                                btn.disabled = false;
                            }
                        }
                    }
                }
            } catch (err) {
                statusMsg.textContent = 'Connection error.';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
